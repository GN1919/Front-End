<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exemplo de houver</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;

        }
        div:hover{
            color: brown;
        }
        div:hover > p{
            display: block;
            color: bisque;
            background-color: brown;
            width: 300px;
        }
        div > p {
            display: none;
        }
    </style>
</head>
<body>
    <h1>exemplo de houver</h1>
    <p>passe o mouse</p>
    <div>
        passe aqui
        <p>texto escondido</p>
    </div>
</body>
</html>
