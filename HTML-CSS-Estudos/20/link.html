<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        a{
            color: brown;
            text-decoration: none;
            font-weight: bold;
        }
        a:visited{
            color: aqua;
        }
        a:hover{
            text-decoration: underline;
            color: black;
        }
        a:active{
            color: chartreuse;
            text-decoration: underline;
        }
        a::after{
            content: '[link]';
            text-decoration: none;
            font-weight: normal;
            color: darkgrey;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://youtu.be/bZHo_CR2__g?si=rTDnYHDafs6DAjLG">Repositorio gihub</a></li>
        <li><a href="https://youtu.be/574ezCafKWk?si=O_Yy9k-dzOZFSTij">cana youtube</a></li>
        <li>site do cursoemvideo</li>

    </ul>
</body>
</html>
