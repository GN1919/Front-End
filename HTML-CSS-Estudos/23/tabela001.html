<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>
       body{
        font-family: Arial, Helvetica, sans-serif;

       } 
       
       table{
        
        width: 300px;
        border-collapse: collapse;
       
       }


       td{
        border: 1px solid black;
          /*com o padding 50px era impossivel alinha as celulas da tabelas*/
          text-align: left;
          vertical-align: text-top;
       }

        
       
    </style>
</head>
<body>
    <!--table row-linha de tabela
        table header-cabecalho
        table data-dados--> 
    <table>
      <tr >
          <td class="linha1">A1</td>
          <td>B1</td>
          <td>C1</td>
      </tr>
       
      <tr>
        <td>A2</td>
        <td>B2</td>
        <td>C2</td>
      </tr>

      <tr>
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
      </tr>


    </table>
</body>
</html>
