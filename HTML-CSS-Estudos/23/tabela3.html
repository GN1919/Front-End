<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     table{
      border-collapse: collapse;
        background-color: bisque;
        
     }
     td{
        border: 1px solid black;
        padding: 10px;  /*tinha colocado no table mas colocasse aqui no dado */
     }

    </style>
</head>
<body>
    <h1>Mesclagem de tabelas</h1>
     <table>
       <tr>
        <td colspan="2">A</td> <!--fazendp o A ocupar 2 linhas-->
        
        <td>C</td>
       </tr>

       <tr>
        <td rowspan="3">D</td> <!--fazendo o d ocupar 2 colunas-->
        <td>E</td>
        <td>F</td>
    
       </tr>

       <tr>
        
        <td>H</td>
        <td>I</td>
        <tr>
           
            <td>K</td>
            <td>L</td>
        </tr>
       </tr>





     </table>


</body>
</html>
