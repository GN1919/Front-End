<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div.conteiner{/*conteiner pai */
            background-color: aqua;
            display: flex;
            height: 400px;
        }

        div.item{
           background-color: beige;
            border: 1px solid black;
           padding: 20px;
           text-align: center;
           
        }

        
    </style>
</head>
<body>
    <div class="conteiner">
     <div class="item" style="order: 5;">a </div> <!--organiza por ordem-->
     <div class="item" style="order: 4;">b</div>
     <div class="item" style="order: 3;">c</div>
     <div class="item" style="order: 2;">d</div>
     <div class="item" style="order: 1;">e</div>
    
   



    </div>
</body>
</html>
